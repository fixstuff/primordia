[package]
name = "primordia-mcp"
version = "0.1.0"
edition = "2021"
authors = ["James (fixstuff)", "Claude (Anthropic)"]
license = "MIT"
repository = "https://github.com/fixstuff/primordia"
homepage = "https://primordia.tools"
description = "LifeAPI as an MCP server over stdio: any MCP client can play."

[dependencies]
primordia-server = { path = "../server" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
primordia-sim = { path = "../sim" }
